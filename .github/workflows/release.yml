name: Trellis Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pre:
        description: "Candidate cycle (rc), promotion (none), or stable preparation (empty)"
        type: string
        default: ""
      version:
        description: "Target version before the prerelease suffix (for example, 1.0.0)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: trellis-release
  queue: max
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # ratchet:actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Trellis
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # ratchet:jdx/mise-action@v4
        with:
          install_args: github:tylerbutler/trellis

      - name: Create or update release PR
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          INPUT_PRE: ${{ inputs.pre }}
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          args=(release pr --base main --branch release/pending)
          case "$INPUT_PRE" in
            "") ;;
            rc|none) args+=(--pre "$INPUT_PRE") ;;
            *) echo "::error::pre must be empty, rc, or none"; exit 1 ;;
          esac
          if [[ -n "$INPUT_VERSION" ]]; then
            args+=(--set "roost=$INPUT_VERSION")
          fi
          trellis "${args[@]}"
