name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  release-check:
    name: Release configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # ratchet:jdx/mise-action@v4
        with:
          install_args: github:tylerbutler/trellis

      - run: trellis doctor

      - run: python3 -B -m unittest discover -s test -p release_workflow_test.py

  test:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [erlang, javascript]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # ratchet:jdx/mise-action@v4
        with:
          install_args: erlang gleam rebar ${{ matrix.target == 'javascript' && 'node' || '' }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6
        with:
          path: |
            build/packages
            ~/.cache/gleam
          key: gleam-${{ runner.os }}-${{ hashFiles('gleam.toml', 'manifest.toml') }}
          restore-keys: |
            gleam-${{ runner.os }}-

      - run: gleam deps download

      - if: matrix.target == 'erlang'
        run: gleam format --check src test

      - run: gleam check --target ${{ matrix.target }}

      - run: gleam test --target ${{ matrix.target }}

      - run: gleam build --target ${{ matrix.target }} --warnings-as-errors
