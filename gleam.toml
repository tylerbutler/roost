name = "roost"
version = "0.1.0"
description = "Phoenix channel wire protocol helpers for Gleam"
licences = ["MIT"]
repository = { type = "github", user = "tylerbutler", repo = "roost" }
gleam = ">= 1.9.0"

[dependencies]
gleam_stdlib = ">= 0.48.0 and < 2.0.0"
gleam_json = ">= 3.0.0 and < 4.0.0"

[dev-dependencies]
unitest = ">= 1.6.1 and < 2.0.0"
phoenix_channel_fixtures = { git = "https://github.com/tylerbutler/phoenix_channel_fixtures.git", ref = "7daccb856d17db6278980277237c201b2acdcdf1" }

[tools.trellis]
members = ["."]

[tools.trellis.changelog]
header_format = "# Changelog"
version_format = "## {{ version }} - {{ date }}"
kind_format = "### {{ kind }}"
change_format = "#### {{ body }}"
kinds = [
  { label = "Breaking", bump = "major" },
  { label = "Added", bump = "minor" },
  { label = "Changed", bump = "patch" },
  { label = "Deprecated", bump = "patch" },
  { label = "Fixed", bump = "patch" },
  { label = "Performance", bump = "patch" },
  { label = "Removed", bump = "patch" },
  { label = "Dependencies", bump = "patch" },
  { label = "Security", bump = "patch" },
]

[tools.trellis.publish]
exact_tag_format = "v{version}"
package_tags = ["exact"]

[tools.trellis.publish.lifecycle]
default = "git_only"

[tools.trellis.release]
resume = true
auto_pre = true
skip_unchanged = true
